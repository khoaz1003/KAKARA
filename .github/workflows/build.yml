name: Build KAKARA APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
        pip install --user --upgrade buildozer cython virtualenv Kivy

    - name: Create buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = KAKARA
        package.name = kakara
        package.domain = org.khoaz1003
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ico
        version = 1.1
        requirements = python3,kivy,yt-dlp,requests,urllib3,certifi,idna
        orientation = landscape
        fullscreen = 1
        android.permissions = INTERNET
        android.api = 31
        android.minapi = 21
        android.ndk_api = 21
        android.private_storage = True
        android.entrypoint = main.py
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build APK with Buildozer
      run: |
        yes | ~/.local/bin/buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: KAKARA-APK
        path: bin/*.apk
